#server.port=${PORT:8080}

spring.application.name=puzzle
server.port=${PORT:8080}

# H2 In-Memory (mesma configuração usada no forecast-application)
spring.datasource.url=jdbc:h2:mem:puzzle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# JWT (obrigatório no Render)
security.jwt.secret=${JWT_SECRET}

# Perfil (igual forecast)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


